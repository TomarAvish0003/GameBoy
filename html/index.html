<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusty Boy DMG-01</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Collapsible Settings Drawer -->
    <aside id="drawer" class="drawer">
        <button id="drawer-toggle" class="drawer-toggle" aria-label="Toggle Settings">⚙</button>
        <div class="drawer-content">
            <h2>Settings</h2>

            <div class="control-group">
                <label for="fileinput" class="file-label">Load ROM (.gb, .bin)</label>
                <input type="file" id="fileinput" accept=".gb,.dmg,.bin">
            </div>

            <div class="control-group">
                <h3>Color Palette</h3>
                <div class="radio-row">
                    <label><input type="radio" name="palette" value="peagreen" checked> DMG Green</label>
                    <label><input type="radio" name="palette" value="pocket"> Pocket B&W</label>
                    <label><input type="radio" name="palette" value="oled"> OLED</label>
                </div>
            </div>

            <div class="control-group">
                <h3>Master Volume</h3>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>

            <div class="control-group">
                <h3>Sound Channels</h3>
                <div class="checkbox-grid">
                    <label><input type="checkbox" id="ch1-toggle" checked> CH1 (Pulse 1)</label>
                    <label><input type="checkbox" id="ch2-toggle" checked> CH2 (Pulse 2)</label>
                    <label><input type="checkbox" id="ch3-toggle" checked> CH3 (Wave)</label>
                    <label><input type="checkbox" id="ch4-toggle" checked> CH4 (Noise)</label>
                </div>
            </div>
            
            <p class="drawer-tip">Tip: Click any button on the console to rebind its key.</p>
        </div>
    </aside>

    <!-- DMG-01 Console Container -->
    <main class="console-wrapper">
        <div class="gameboy">
            <div class="top-grooves"></div>

            <!-- Screen Surround / Bezel -->
            <div class="screen-bezel">
                <div class="bezel-header">
                    <div class="stripe blue"></div>
                    <div class="stripe magenta"></div>
                    <span class="bezel-title">DOT MATRIX WITH STEREO SOUND</span>
                    <div class="stripe magenta"></div>
                    <div class="stripe blue"></div>
                </div>

                <div class="screen-content">
                    <div class="battery-led" id="battery-led">
                        <div class="led-light"></div>
                        <span>BATTERY</span>
                    </div>

                    <!-- Screen Canvas & FPS Overlay -->
                    <div class="canvas-container" style="position: relative; line-height: 0;">
                        <div id="fps-display" style="position: absolute; top: 6px; right: 8px; font-family: monospace; font-size: 11px; color: #39ff14; background: rgba(0, 0, 0, 0.75); padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 10;">-- FPS (100%)</div>
                        <canvas id="canvas" width="480" height="432"></canvas>
                    </div>
                </div>
            </div>

            <div class="brand-logo">
                <span class="brand-nintendo">Nintendo</span>
                <span class="brand-gameboy">RUSTY BOY<span class="trademark">TM</span></span>
            </div>

            <!-- Controls Area -->
            <div class="controls-area">
                <!-- D-Pad -->
                <div class="dpad-container">
                    <div class="dpad-center-indent"></div>
                    <button class="dpad-btn up" id="btn-dpad-up" title="Click to rebind UP">
                        <span class="key-badge" id="badge-up">Up</span>
                    </button>
                    <button class="dpad-btn down" id="btn-dpad-down" title="Click to rebind DOWN">
                        <span class="key-badge" id="badge-down">Down</span>
                    </button>
                    <button class="dpad-btn left" id="btn-dpad-left" title="Click to rebind LEFT">
                        <span class="key-badge" id="badge-left">Left</span>
                    </button>
                    <button class="dpad-btn right" id="btn-dpad-right" title="Click to rebind RIGHT">
                        <span class="key-badge" id="badge-right">Right</span>
                    </button>
                </div>

                <!-- Action Buttons (A / B) -->
                <div class="action-buttons">
                    <div class="action-btn-wrapper">
                        <button class="action-btn b" id="btn-b" title="Click to rebind B">
                            <span class="key-badge" id="badge-b">X</span>
                        </button>
                        <span class="action-label">B</span>
                    </div>

                    <div class="action-btn-wrapper">
                        <button class="action-btn a" id="btn-a" title="Click to rebind A">
                            <span class="key-badge" id="badge-a">Z</span>
                        </button>
                        <span class="action-label">A</span>
                    </div>
                </div>
            </div>

            <!-- Start & Select -->
            <div class="meta-buttons">
                <div class="meta-btn-wrapper">
                    <button class="pill-btn" id="btn-select" title="Click to rebind Select">
                        <span class="key-badge" id="badge-select">Shift</span>
                    </button>
                    <span class="meta-label">SELECT</span>
                </div>
                <div class="meta-btn-wrapper">
                    <button class="pill-btn" id="btn-start" title="Click to rebind Start">
                        <span class="key-badge" id="badge-start">Enter</span>
                    </button>
                    <span class="meta-label">START</span>
                </div>
            </div>

            <!-- Speaker Grille -->
            <div class="speaker-grille">
                <div class="grille-slot"></div>
                <div class="grille-slot"></div>
                <div class="grille-slot"></div>
                <div class="grille-slot"></div>
                <div class="grille-slot"></div>
                <div class="grille-slot"></div>
            </div>
        </div>
    </main>

    <script type="module" src="./index.js"></script>
</body>
</html>
