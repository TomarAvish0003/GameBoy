name: Release Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: desktop.exe
            release_file: rusty-boy-windows.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: desktop
            release_file: rusty-boy-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: desktop
            release_file: rusty-boy-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin desktop --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.release_file }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_file }}
          path: ${{ matrix.release_file }}

  create-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true