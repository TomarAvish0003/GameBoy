name: Release Desktop Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake (Required for bundled SDL2)
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build Release Binary
        run: cargo build --release --bin desktop

      - name: Copy Executable
        shell: pwsh
        run: |
          Copy-Item "target/release/desktop.exe" -Destination "rusty-boy-windows.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusty-boy-windows.exe
          path: rusty-boy-windows.exe

  create-release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: rusty-boy-windows.exe
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: rusty-boy-windows.exe
          generate_release_notes: true