name: Release Desktop Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake (Required for bundled SDL2)
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build Release Binary
        run: cargo build --release --manifest-path desktop/Cargo.toml

      - name: Copy Executable
        shell: pwsh
        run: |
          if (Test-Path "desktop/target/release/desktop.exe") {
            Copy-Item "desktop/target/release/desktop.exe" -Destination "rusty-boy-windows.exe"
          } elseif (Test-Path "target/release/desktop.exe") {
            Copy-Item "target/release/desktop.exe" -Destination "rusty-boy-windows.exe"
          } else {
            Write-Error "Could not locate desktop.exe output!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: rusty-boy-windows.exe

  create-release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: release-dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-dist/rusty-boy-windows.exe
          generate_release_notes: true