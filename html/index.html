<!DOCTYPE html>
<html>
    <head>
        <title>Game Boy Emulator</title>
        <meta charset="utf-8">
        <style>
            html {
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
                max-width: 1000px;
                margin: 0 auto;
                background-color: #222;
                color: #fff;
            }

            canvas {
                display: block;
                margin: 20px auto;
                border: 4px solid #444;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
                image-rendering: pixelated;
            }
        </style>
    </head>
    <body>
        <h1>My Game Boy Emulator</h1>
        <label for="fileinput">Select a GB game:</label>
        <input type="file" id="fileinput" accept=".gb, .dmg" autocomplete="off"/>
        <br/><br/>
        <canvas id="canvas" width="160" height="144"></canvas>
        <script type="module" src="index.js"></script>
    </body>
</html>
